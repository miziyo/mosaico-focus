name: ci
on: [push, pull_request]

env:
  EMSDK_VERSION: 4.0.10

jobs:
  core-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: make test

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
      - name: Build web simulator
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          make deps   # must be its own make run: the LVGL file list is read at startup
          make web
      - name: End-to-end tests
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          (cd build/web && python3 -m http.server 8000 &)
          sleep 1
          node tests/web_smoke.js
          node tests/lab_smoke.js
